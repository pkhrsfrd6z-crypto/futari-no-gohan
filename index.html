<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>ふたりのごはん</title>
<style>
:root{--bg:#f7f5f0;--ink:#22251f;--muted:#77786f;--accent:#34483d;--card:#fffefa;--line:#e5e1d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:620px;margin:auto;min-height:100svh;padding:24px 20px 42px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.logo{font-weight:700;color:var(--ink)}.screen{display:none;flex:1;flex-direction:column}.screen.active{display:flex}
.hero{justify-content:center;text-align:center;align-items:center;gap:20px;padding:30px 0 70px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted)}h1{font-size:clamp(32px,8vw,48px);font-weight:650;letter-spacing:.03em;line-height:1.35;margin:0}
.sub{font-size:14px;color:var(--muted);line-height:1.8;margin:0}
button,.btn{font:inherit;cursor:pointer}.start{margin-top:18px;background:var(--accent);color:white;border:0;border-radius:999px;padding:17px 34px;min-width:180px;font-size:14px;letter-spacing:.08em}
.section-head{padding:28px 0 22px}.section-head h2{font-size:27px;margin:8px 0;font-weight:650}.back{border:0;background:transparent;color:var(--muted);padding:10px 0;text-align:left;font-size:13px}
.genres{display:grid;grid-template-columns:1fr 1fr;gap:12px}.genre{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:22px 16px;min-height:140px;text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}.emoji{font-size:30px}.genre strong{font-size:17px}.genre small{color:var(--muted);font-size:11px;margin-top:5px}
.places{display:grid;gap:12px;padding-bottom:24px}.place{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;align-items:center;gap:14px}.place-photo{width:68px;height:68px;object-fit:cover;border-radius:12px;flex-shrink:0;background:#e8e4dc}.place-info{flex:1;min-width:0}.place-info strong{font-size:15px;display:block}.place-info span{font-size:11px;color:var(--muted);display:block;margin-top:5px}.map{display:inline-block;color:var(--accent);font-size:12px;font-weight:650;text-decoration:none;border:1px solid #c9d1c9;border-radius:999px;padding:10px 12px;white-space:nowrap}.pick-button{width:100%;margin:0 0 16px;border:0;border-radius:14px;padding:15px;background:#34483d;color:#fff;font-size:14px;font-weight:650;letter-spacing:.03em}.place.picked{border:2px solid #34483d;background:#f0f3ed}.picked-label{display:inline-block!important;margin-top:8px!important;color:#34483d!important;font-size:11px!important;font-weight:700}.draw-overlay{position:fixed;inset:0;z-index:9999;background:rgba(24,30,25,.58);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .22s ease}.draw-overlay.visible{opacity:1}.draw-card{width:min(100%,360px);background:#fffefa;border-radius:26px;padding:30px 22px;text-align:center;box-shadow:0 24px 70px #0003}.draw-dice{font-size:58px;display:block;animation:dice-roll .65s ease-in-out infinite}.draw-title{font-size:22px;font-weight:750;margin:14px 0 8px}.draw-sub{font-size:13px;color:#77786f;line-height:1.7}.draw-result{font-size:18px;font-weight:750;line-height:1.5;margin:18px 0}.draw-map{display:block;margin:0 auto 8px;width:100%;text-align:center;text-decoration:none;border-radius:999px;padding:14px 12px;background:#34483d;color:#fff;font-size:14px;font-weight:700;min-height:48px;box-sizing:border-box}.draw-map[hidden]{display:none!important}.draw-close,.draw-again{width:100%;box-sizing:border-box;border:0;border-radius:999px;padding:15px 14px;background:#34483d;color:white;font-weight:700;margin-top:10px;min-height:48px;font-size:15px;cursor:pointer}.draw-again{background:#ebece5;color:#34483d}.draw-close[hidden],.draw-again[hidden],.draw-result[hidden]{display:none!important}.draw-close:not([hidden]),.draw-again:not([hidden]){display:block!important}.draw-overlay.result .draw-dice{animation:none}@keyframes dice-roll{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.14)} }
footer{padding-top:22px;margin-top:auto;text-align:center;font-size:11px;color:var(--muted)}
@media(min-width:500px){main{padding-top:30px}.hero{padding-bottom:100px}.genre{min-height:160px;padding:26px}}
</style>
</head>
<body><main>
<header><span class="logo">ふたりのごはん</span><span>OUR FOOD DATE</span></header>
<section id="home" class="screen active hero">
<div class="eyebrow">TODAY'S DATE</div><h1>今日は何の気分？</h1><p class="sub">ふたりで食べたいものを選ぼう。</p>
<button class="start" id="start">TAP TO START　↗</button>
</section>
<section id="genres" class="screen">
<button class="back" data-back="home">← 最初に戻る</button><div class="section-head"><div class="eyebrow">STEP 01</div><h2>何を食べたい？</h2><p class="sub">今の気分に近いジャンルを選んでね。</p></div>
<div class="genres">
<button class="genre" data-genre="ramen"><span class="emoji">🍜</span><span><strong>ラーメン</strong><small>RAMEN</small></span></button>
<button class="genre" data-genre="world"><span class="emoji">🌏</span><span><strong>世界の料理</strong><small>WORLD FOOD</small></span></button>
<button class="genre" data-genre="japanese"><span class="emoji">🍱</span><span><strong>和食</strong><small>JAPANESE</small></span></button>
<button class="genre" data-genre="curry"><span class="emoji">🍛</span><span><strong>カレー</strong><small>CURRY</small></span></button>
</div><button id="surpriseAll" class="pick-button" type="button" style="margin-top:16px">ジャンルもお店も全部おまかせ ↗</button></section>
<section id="places" class="screen">
<button class="back" data-back="genres">← ジャンルに戻る</button><div class="section-head"><div class="eyebrow">STEP 02</div><h2 id="placeTitle">お店候補</h2><p class="sub">気になるお店を選ぶとGoogleマップが開くよ。</p></div><button id="pickForUs" class="pick-button" type="button">迷ったら、ひろしに決めてもらう ↗</button><div id="placeList" class="places"></div>
</section>
<footer>ふたりの「おいしい」を見つけよう。</footer>
</main>
<script>
const restaurants={
ramen:{title:"ラーメン",emoji:"🍜",photo:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=320&q=80",links:["https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("らーめん専門店ぶぶか 吉祥寺北口店"),"https://www.google.com/maps/search/?api=1&query=%E3%81%A4%E3%81%91%E9%BA%BA%20%E3%81%88%E3%82%93%E5%AF%BA%20%E5%90%89%E7%A5%A5%E5%AF%BA%E7%B7%8F%E6%9C%AC%E5%BA%97","https://www.google.com/maps/search/?api=1&query=%E3%82%89%E3%81%81%E3%82%81%E3%82%93%20%E7%9C%9F%E9%A2%A8","https://www.google.com/maps/search/?api=1&query=%E3%82%89%E3%81%81%E9%BA%BA%20%E3%81%95%E3%82%8F%E7%94%B0"],names:["らーめん専門店 ぶぶか 吉祥寺北口店","つけ麺 えん寺 吉祥寺総本店","らぁめん 真風","らぁ麺 さわ田"]},
world:{title:"世界の料理",emoji:"🌏",photo:"https://images.unsplash.com/photo-1546549032-9571cd6b27df?auto=format&fit=crop&w=320&q=80",links:["https://www.google.com/maps/search/?api=1&query=%E3%82%BF%E3%82%A4%E6%96%99%E7%90%86%E3%82%AD%E3%83%B3%E3%82%B0%20%E3%82%B5%E3%82%A4%E3%82%A2%E3%83%A0%E5%90%89%E7%A5%A5%E5%AF%BA%E6%9C%AC%E5%BA%97","https://www.google.com/maps/search/?api=1&query=Surya%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=33%20Manet%20cua%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=%E3%83%99%E3%83%88%E3%83%8A%E3%83%A0%E6%96%99%E7%90%86%E3%82%B9%E3%82%A2%20%E5%90%89%E7%A5%A5%E5%AF%BA%E5%BA%97"],names:["タイ料理キング サイアム吉祥寺本店","Surya","33 Manet cua","ベトナム料理スア 吉祥寺店"]},
japanese:{title:"和食",emoji:"🍱",photo:"https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=320&q=80",links:["https://www.google.com/maps/search/?api=1&query=TSUMUGU%20%E3%83%84%E3%83%A0%E3%82%B0%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E6%B8%85%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=%E5%90%89%E7%A5%A5%E5%AF%BA%E3%81%BE%E3%81%90%E3%82%8D%E4%BA%BA%20Mogura","https://www.google.com/maps/search/?api=1&query=%E9%87%91%E5%AD%90%E5%B1%8B%20%E5%90%89%E7%A5%A5%E5%AF%BA"],names:["TSUMUGU（ツムグ）","中清","吉祥寺まぐろ人 Mogura","金子屋"]},
curry:{title:"カレー",emoji:"🍛",photo:"https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?auto=format&fit=crop&w=320&q=80",links:["https://www.google.com/maps/search/?api=1&query=%E3%83%A2%E3%83%B3%E3%82%BF%E3%83%8A%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=%E6%9C%AD%E5%B9%8C%E3%82%B9%E3%83%BC%E3%83%97%E3%82%AB%E3%83%AA%E3%83%BC%E3%82%AD%E3%83%B3%E3%82%B0%E5%90%89%E7%A5%A5%E5%AF%BA%E5%BA%97%20SOUP%20CURRY%20KING","https://www.google.com/maps/search/?api=1&query=%E3%81%BE%E3%82%81%E8%94%B5%20%E5%90%89%E7%A5%A5%E5%AF%BA","https://www.google.com/maps/search/?api=1&query=%E5%96%AB%E8%8C%B6%E5%BA%97%20%E8%8C%B6%E6%88%BF%E6%AD%A6%E8%94%B5%E9%87%8E%E6%96%87%E5%BA%AB"],names:["モンタナ","札幌スープカリーキング吉祥寺店 SOUP CURRY KING","まめ蔵","喫茶店 茶房武蔵野文庫"]}
};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0)}
let currentPlaces=[];
function runDraw(chosen,mapUrl,done){const overlay=document.createElement('div');overlay.className='draw-overlay';overlay.innerHTML='<div class="draw-card"><span class="draw-dice">🎲</span><div class="draw-title">ふたりのお店ガチャ</div><p class="draw-sub">ふたりの今日のごはんを選んでるで…</p><div class="draw-result" hidden></div><a class="draw-map" hidden target="_blank" rel="noopener noreferrer">📍 Googleマップで見る ↗</a><button class="draw-close" hidden>このお店に決定！</button><button class="draw-again" hidden>🎲 もう一回引く</button></div>';document.body.append(overlay);requestAnimationFrame(()=>overlay.classList.add('visible'));const result=overlay.querySelector('.draw-result');const map=overlay.querySelector('.draw-map');const close=overlay.querySelector('.draw-close');const again=overlay.querySelector('.draw-again');setTimeout(()=>{overlay.classList.add('result');overlay.querySelector('.draw-title').textContent='今日のお店は…';overlay.querySelector('.draw-sub').textContent='ふたりでおいしい時間を楽しんでな！';result.textContent=chosen;result.hidden=false;map.href=mapUrl;map.removeAttribute('hidden');map.style.display='block';map.style.visibility='visible';map.style.opacity='1';overlay.querySelector('.draw-dice').textContent='✨';close.hidden=false;again.hidden=false;close.onclick=()=>{overlay.classList.remove('visible');setTimeout(()=>overlay.remove(),220);done&&done()};again.onclick=()=>{overlay.classList.remove('visible');setTimeout(()=>{overlay.remove();document.getElementById('pickForUs').click()},220)}} ,1100)}
document.getElementById('pickForUs').addEventListener('click',()=>{if(!currentPlaces.length)return;document.querySelectorAll('#placeList .place').forEach(row=>{row.classList.remove('picked');const label=row.querySelector('.picked-label');if(label)label.remove()});const index=Math.floor(Math.random()*currentPlaces.length);const chosen=currentPlaces[index];const name=chosen.querySelector('.place-info strong').textContent;runDraw(name,chosen.querySelector('a.map').href,()=>{chosen.classList.add('picked');const label=document.createElement('span');label.className='picked-label';label.textContent='今日のおすすめ！';chosen.querySelector('.place-info').append(label);chosen.scrollIntoView({behavior:'smooth',block:'center'})})});
document.getElementById('start').addEventListener('click',()=>show('genres'));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.back)));
function renderPlaces(id,autoPick=false){const data=restaurants[id];document.getElementById('placeTitle').textContent=data.title+'のお店候補';const list=document.getElementById('placeList');list.replaceChildren();currentPlaces=[];data.links.forEach((url,i)=>{const row=document.createElement('article');row.className='place';const photo=document.createElement('img');photo.className='place-photo';photo.src=data.photo;photo.alt=data.title+'の料理イメージ';photo.loading='lazy';photo.onerror=()=>{photo.style.display='none'};const info=document.createElement('div');info.className='place-info';const name=document.createElement('strong');name.textContent=(data.names&&data.names[i])||'お店候補 '+(i+1);const note=document.createElement('span');note.textContent='Googleマップで場所を確認';info.append(name,note);const a=document.createElement('a');a.className='map';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='地図を見る ↗';row.append(photo,info,a);list.append(row);currentPlaces.push(row)});show('places');if(autoPick)document.getElementById('pickForUs').click()}
document.querySelectorAll('[data-genre]').forEach(b=>b.addEventListener('click',()=>renderPlaces(b.dataset.genre)));
document.getElementById('surpriseAll').addEventListener('click',()=>{const ids=Object.keys(restaurants);const id=ids[Math.floor(Math.random()*ids.length)];renderPlaces(id);document.getElementById('pickForUs').click()});
</script></body></html>
